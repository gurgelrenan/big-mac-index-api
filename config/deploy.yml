service: big-mac-index-api
image: gurgelrenan/big-mac-index-api
servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_HOST", "187.77.50.57") %>
    options:
      memory: 512m
      cpus: 1.0
registry:
  server: ghcr.io
  username: gurgelrenan
  password:
    - KAMAL_REGISTRY_PASSWORD
builder:
  arch: amd64
  context: .
proxy:
  host: bigmac-api.gurgelrenan.tech
  app_port: 3000
  ssl: false
  forward_headers: true
  healthcheck:
    path: /up
env:
  clear:
    RAILS_ENV: production
    RACK_ENV: production
    RAILS_LOG_TO_STDOUT: "1"
    RAILS_LOG_LEVEL: info
    DATABASE_HOST: big-mac-index-api-db
    WEB_CONCURRENCY: "1"
    RAILS_MAX_THREADS: "5"
  secret:
    - SECRET_KEY_BASE
    - BIG_MAC_INDEX_API_DATABASE_PASSWORD
accessories:
  db:
    image: postgres:17-alpine
    host: <%= ENV.fetch("KAMAL_HOST", "187.77.50.57") %>
    options:
      memory: 256m
    env:
      clear:
        POSTGRES_DB: big_mac_index_api_production
        POSTGRES_USER: big_mac_index_api
      secret:
        - POSTGRES_PASSWORD:BIG_MAC_INDEX_API_DATABASE_PASSWORD
    directories:
      - big-mac-index-api-postgres:/var/lib/postgresql/data
  router:
    image: nginx:stable-alpine
    host: <%= ENV.fetch("KAMAL_HOST", "187.77.50.57") %>
    options:
      memory: 32m
    labels:
      traefik.enable: "true"
      traefik.http.routers.bigmac-api.rule: "Host(`bigmac-api.gurgelrenan.tech`)"
      traefik.http.routers.bigmac-api.entrypoints: websecure
      traefik.http.routers.bigmac-api.tls: "true"
      traefik.http.routers.bigmac-api.tls.certresolver: letsencrypt
      traefik.http.routers.bigmac-api.service: bigmac-api
      traefik.http.services.bigmac-api.loadbalancer.server.port: "80"
    files:
      - config/deploy-router.conf:/etc/nginx/conf.d/default.conf:ro
